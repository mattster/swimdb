<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SwimDB{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/output.css">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body class="min-h-full bg-slate-50 text-slate-800 antialiased">

  <nav class="bg-blue-800 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-8">
      <a href="/" class="font-bold text-xl tracking-tight text-white hover:text-blue-100">SwimDB</a>
      <a href="/" class="text-blue-200 hover:text-white text-sm transition-colors">Athletes</a>
      <a href="/events" class="text-blue-200 hover:text-white text-sm transition-colors">Event Times</a>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
