{% extends "base.html" %}
{% block title %}SwimDB — Event Times{% endblock %}

{% block content %}
<h1 class="text-3xl font-bold text-slate-900 mb-6">Event Top Times</h1>

<form
  hx-get="/htmx/event-results"
  hx-target="#event-table"
  hx-swap="innerHTML"
  hx-push-url="true"
  hx-indicator="#results-spinner"
  class="bg-white border border-slate-200 rounded-xl shadow-sm p-5 mb-6"
>
  <div class="flex flex-wrap gap-4 items-end">

    <div class="flex flex-col gap-1">
      <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Gender</label>
      <select name="gender"
              class="border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="M" {% if selected.gender == 'M' %}selected{% endif %}>Men</option>
        <option value="F" {% if selected.gender == 'F' %}selected{% endif %}>Women</option>
      </select>
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Distance</label>
      <select name="distance"
              class="border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
        {% for d in [50, 100, 200, 400, 800, 1500] %}
        <option value="{{ d }}" {% if selected.distance == d %}selected{% endif %}>{{ d }}m</option>
        {% endfor %}
      </select>
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Stroke</label>
      <select name="stroke"
              class="border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
        {% for s in ['freestyle', 'backstroke', 'breaststroke', 'butterfly', 'im'] %}
        <option value="{{ s }}" {% if selected.stroke == s %}selected{% endif %}>
          {{ s | replace('im', 'Individual Medley') | title }}
        </option>
        {% endfor %}
      </select>
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Course</label>
      <select name="course"
              class="border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="LCM" {% if selected.course == 'LCM' %}selected{% endif %}>LCM (50m)</option>
        <option value="SCM" {% if selected.course == 'SCM' %}selected{% endif %}>SCM (25m)</option>
        <option value="SCY" {% if selected.course == 'SCY' %}selected{% endif %}>SCY (25yd)</option>
      </select>
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Top</label>
      <input name="limit" type="number" value="{{ selected.limit }}" min="1" max="100"
             class="border border-slate-300 rounded-lg px-3 py-2 text-sm w-20 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Year</label>
      <input name="year" type="number" value="{{ selected.year or '' }}"
             placeholder="All-time" min="1900" max="2099"
             class="border border-slate-300 rounded-lg px-3 py-2 text-sm w-28 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <div class="flex items-end">
      <button type="submit"
              class="relative bg-blue-700 text-white px-5 py-2 rounded-lg text-sm font-medium hover:bg-blue-800 transition-colors">
        Search
        <span id="results-spinner" class="htmx-indicator absolute inset-0 flex items-center justify-center bg-blue-700 rounded-lg">
          <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
        </span>
      </button>
    </div>

  </div>
</form>

<div id="event-table">
  {% if results is defined %}
    {% include "partials/event_table.html" %}
  {% endif %}
</div>
{% endblock %}
